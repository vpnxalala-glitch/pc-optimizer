name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile C# Code
        run: |
          cd ${{ github.workspace }}
          & "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe" /target:winexe /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:PC_Optimizer.exe Program.cs
          
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pc-optimizer
          path: PC_Optimizer.exe
